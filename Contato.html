<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fale Conosco - Orbit Fitness</title>
    <link rel="stylesheet" href="variaveis.css">
    <link rel="stylesheet" href="contato.css">
</head>
<body>

    <div class="titulo-pagina">
        <h1>Fale conosco</h1>
        <p>Envie sua mensagem ou agende uma aula experimental.</p>
    </div>

    <section class="contato-grid">
        <div class="formulario">
            <h2>Envie uma mensagem</h2>
            <form action="#" method="post">

                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>

                <label for="email">E-mail</label>
                <input type="email" id="email" name="email" placeholder="aluno@email.com" required>

                <label for="telefone">Telefone</label>
                <input type="tel" id="telefone" name="telefone" placeholder="(15) 99999-9999">

                <label for="objetivo">Objetivo do contato</label>
                <select id="objetivo" name="objetivo">
                    <option value="">Selecione uma opção</option>
                    <option value="duvida">Tirar dúvida</option>
                    <option value="aula">Agendar aula experimental</option>
                    <option value="outro">Outro assunto</option>
                </select>

                <label for="mensagem">Mensagem</label>
                <textarea id="mensagem" name="mensagem" rows="5" placeholder="Escreva sua mensagem"></textarea>

                <button type="submit" class="btn-verde">Enviar mensagem</button>

            </form>
        </div>
    </section>

</body>
</html>
